tasks.register('runClient', JavaExec) {
    group = 'expo'
    description = 'launch the game with the rebuilt jar through launchwrapper'
    dependsOn 'jar'
    doFirst {
        def gd = project.ext.gameDir
        if (gd == null) throw new GradleException(
            'Minecraft directory not found. Use -Pgame_dir=<path> or set game_dir in local.properties')
        def v = project.property('mc_version')
        def natives = new File(gd, "versions/$v/natives-windows-x86_64")
        if (!natives.isDirectory()) {
            natives = new File(gd, "versions/$v").listFiles()?.find { it.isDirectory() && it.name.startsWith('natives') }
        }
        def runDir = file('run')
        runDir.mkdirs()

        def snapJar = expoRunSnapshot()

        classpath = files(new File(gd, "versions/$v/${v}.jar")) +
                    fileTree(dir: new File(gd, 'libraries'), include: '**/*.jar') +
                    files(snapJar)

        jvmArgs = ['-noverify',
                   '-Xmx2G',
                   "-Djava.library.path=${natives?.absolutePath}",
                   '-Dfml.coreMods.load=' + project.property('coremod_class')]

        if (project.hasProperty('debugClassLoading')) {
            jvmArgs += ['-Dlegacy.debugClassLoading=true']
            logger.lifecycle('[EXPORUN] legacy.debugClassLoading=true -- every class-load failure will be logged at ERROR')
        }

        if (project.hasProperty('selftest')) {
            jvmArgs += ['-Dexpo.selftest=1']
        }

        // add code
        if (project.hasProperty('carrierprobe')) {
            jvmArgs += ['-Dexpo.carrierlog=' + new File(projectDir, 'work/carriers-runtime.tsv').absolutePath]
            logger.lifecycle('[EXPORUN] carrier log -> work/carriers-runtime.tsv')
        }

        // add code
        if (project.hasProperty('handleprobe')) {
            jvmArgs += ['-Dexpo.handleprobe=' + new File(projectDir, 'work/handles.tsv').absolutePath]
            logger.lifecycle('[EXPORUN] handle probe -> work/handles.tsv')
        }

        // add code
        if (project.hasProperty('tabledump')) {
            def dumpTo = project.property('tabledump').toString()
            if (dumpTo == 'true' || dumpTo.isEmpty()) {
                dumpTo = new File(projectDir, 'work/tables.tsv').absolutePath
            }
            jvmArgs += ['-Dexpo.tabledump=' + dumpTo]
            if (project.hasProperty('tabledumpEvery')) {
                jvmArgs += ['-Dexpo.tabledump.every=' + project.property('tabledumpEvery')]
            }
            if (project.hasProperty('tabledumpForce')) {
                jvmArgs += ['-Dexpo.tabledump.force=1']   // add code
                logger.lifecycle('[EXPORUN] table dump forces class init')
            }
            logger.lifecycle("[EXPORUN] table dump -> ${dumpTo}")
        }


        if (project.hasProperty('selftestSweep')) {
            jvmArgs += ['-Dexpo.selftest.sweep=' + project.property('selftestSweep')]
            logger.lifecycle("[EXPORUN] selftest sweep = ${project.property('selftestSweep')}")
        }

        if (project.hasProperty('selftestWorld')) {
            jvmArgs += ['-Dexpo.selftest.world=' + project.property('selftestWorld')]
            logger.lifecycle("[EXPORUN] selftest world = ${project.property('selftestWorld')}")
        }

        def tweakers = ['net.minecraftforge.fml.common.launcher.FMLTweaker']
        def wantOptifine = !project.hasProperty('optifine') ||
                           project.property('optifine').toString() != 'false'
        if (wantOptifine) {
            def ofDir = new File(gd, 'libraries/optifine/OptiFine')
            def ofJar = ofDir.isDirectory() ? fileTree(dir: ofDir, include: '**/*.jar')
                    .files.find { !it.name.contains('installer') } : null
            if (ofJar == null && ofDir.isDirectory()) {
                ofJar = fileTree(dir: ofDir, include: '**/*.jar').files.find { true }
            }
            if (ofJar != null) {
                tweakers += 'optifine.OptiFineForgeTweaker'
                logger.lifecycle("OptiFine: ${ofJar.name} (tweaker only, not prepended)")
            } else {
                logger.lifecycle('OptiFine not found under libraries/optifine/OptiFine, skipping')
            }
        }

        args = tweakers.collectMany { ['--tweakClass', it] } + [
                '--username', 'Player',
                '--version', v,
                '--gameDir', runDir.absolutePath,
                '--assetsDir', new File(gd, 'assets').absolutePath,
                '--assetIndex', '1.8',
                '--uuid', '00000000000000000000000000000000',
                '--accessToken', '0',
                '--userType', 'legacy',
                '--versionType', 'release']
    }
    javaLauncher = java8
    mainClass = 'net.minecraft.launchwrapper.Launch'
    workingDir = file('run')
    finalizedBy 'runClientAudit'
}

